<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <title>InfluenceIQ</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3EA1FF"/>
      <stop offset="1" stop-color="#0062D6"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- app-icon shape: rounded square, ~22% corner radius -->
  <rect width="64" height="64" rx="14.5" fill="url(#bg)"/>
  <rect width="64" height="64" rx="14.5" fill="url(#shine)"/>
  <!-- "I" -->
  <rect x="12" y="19" width="6.5" height="26" rx="3.25" fill="#fff"/>
  <!-- "Q" -->
  <circle cx="37.5" cy="31.5" r="10.5" fill="none" stroke="#fff" stroke-width="6"/>
  <line x1="42" y1="37" x2="49" y2="45" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
</svg>
