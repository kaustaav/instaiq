spring.application.name=crm-backend

# ---------- Configuration sources ----------
# Locally, read the repo's .env (git-ignored) so the same DB_* values drive docker compose and the app.
# On servers there is no .env; the same names come from real environment variables instead.
# ("optional:" = skip silently if the file isn't there; "[.properties]" = parse it as key=value lines.)
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# ---------- Database ----------
# Every value is an environment variable, never hard-coded, so one jar runs anywhere (laptop, EC2, a customer's AWS).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:influenceiq}
spring.datasource.username=${DB_USER:influenceiq}
# No real default: a deployment without DB_PASSWORD fails to connect, loudly.
spring.datasource.password=${DB_PASSWORD:}

# Flyway owns the schema (SQL files in db/migration). Hibernate only checks that entities match the tables.
spring.jpa.hibernate.ddl-auto=validate
# Don't keep a DB session open while rendering HTTP responses; queries happen in services, not in controllers.
spring.jpa.open-in-view=false
# Load lazy collections (members -> deliverables -> drafts) in batches of up to 50 instead of one query each
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# ---------- Demo data ----------
# Load 500 fictional influencers into an EMPTY database on startup. Only for local/demo use (DEMO_DATA=true in .env).
app.demo-data.enabled=${DEMO_DATA:false}

# ---------- Actuator ----------
# Show which health components (e.g. db) are up, not just the overall status.
management.endpoint.health.show-components=always

# Other websites allowed to call the API from a browser (see ApiAccessConfig). Empty locally (same site only).
# On a server: CORS_ORIGINS=https://develop.<app>.amplifyapp.com
app.cors.allowed-origins=${CORS_ORIGINS:}

# Sign-in with Google (see common.security). On unless AUTH_ENABLED=false (a laptop experiment, never a server).
# Who gets in: Google Workspace domains (checked via the token's "hd" claim) and/or individual emails, comma-separated.
app.auth.enabled=${AUTH_ENABLED:true}
app.auth.google-client-id=${GOOGLE_CLIENT_ID:}
app.auth.allowed-domains=${ALLOWED_DOMAINS:}
app.auth.allowed-emails=${ALLOWED_EMAILS:}
